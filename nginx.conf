# nginx.conf (à la racine)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Gestion des routes React
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy pour les endpoints Django non-API (comme /manager/login/, /user/, /logout/)
    # DOIT être AVANT /api/ pour éviter les conflits
    location ~ ^/(manager|user|logout)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Proxy vers l'API Django (toutes les routes /api/)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Proxy pour les fichiers statiques Django
    location /static/ {
        proxy_pass http://backend:8000;
    }
    
    # Proxy pour les médias Django
    location /media/ {
        proxy_pass http://backend:8000;
    }
}